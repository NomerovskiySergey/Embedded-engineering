[platformio]
src_dir = main

[env:waveshare_esp32_c6_lcd]
platform = espressif32@7.0.1
board = esp32-c6-devkitc-1
framework = espidf
; Connected board verified by esptool: ESP32-C6FH8, 8 MB flash.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
upload_speed = 460800
